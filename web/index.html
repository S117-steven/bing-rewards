<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bing 双号刷积分</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand-group">
        <h1 class="app-title">Bing Rewards 控制台</h1>
        <p class="app-subtitle">双号自动刷积分 · 搜索 + Daily Set</p>
      </div>
    </header>

    <main class="app-layout">
      <!-- 执行设置 -->
      <section class="section-settings">
        <div class="section-header"><h2>执行设置</h2></div>
        <div class="settings-card">
          <!-- 执行模式 -->
          <div class="setting-row">
            <label class="setting-label">执行模式</label>
            <div class="mode-group">
              <label class="mode-option">
                <input type="radio" name="exec-mode" value="now" checked>
                <span class="mode-btn">立即执行</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="exec-mode" value="delay">
                <span class="mode-btn">延迟执行</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="exec-mode" value="schedule">
                <span class="mode-btn">定时执行</span>
              </label>
            </div>
          </div>

          <!-- 延迟输入 -->
          <div class="setting-row sub-setting hidden" id="delay-row">
            <label class="setting-label">延迟时间</label>
            <div class="input-group">
              <input type="number" id="delay-minutes" class="input-field" min="1" max="1440" value="30" placeholder="分钟">
              <span class="input-suffix">分钟后执行</span>
            </div>
          </div>

          <!-- 定时输入 -->
          <div class="setting-row sub-setting hidden" id="schedule-row">
            <label class="setting-label">执行时间</label>
            <div class="input-group">
              <input type="time" id="schedule-time" class="input-field" value="03:30">
              <span class="input-suffix">将在今天该时刻执行（若已过则明天）</span>
            </div>
          </div>

          <!-- 完成后关机 -->
          <div class="setting-row setting-row-last">
            <label class="setting-label">完成后</label>
            <label class="toggle-switch-label">
              <label class="toggle-switch">
                <input type="checkbox" id="shutdown-after">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-text">执行完毕后自动关机</span>
            </label>
          </div>
        </div>
      </section>

      <!-- 状态卡片 -->
      <section class="section-status">
        <div class="status-grid">
          <div class="status-card" id="card-main">
            <div class="card-label">主号</div>
            <div class="card-state" id="state-main">待命</div>
            <div class="card-detail" id="detail-main">-</div>
          </div>
          <div class="status-card" id="card-small">
            <div class="card-label">小号</div>
            <div class="card-state" id="state-small">待命</div>
            <div class="card-detail" id="detail-small">-</div>
          </div>
          <div class="status-card card-overall" id="card-overall">
            <div class="card-label">总耗时</div>
            <div class="card-state" id="state-overall">-</div>
            <div class="card-detail" id="detail-overall">就绪</div>
          </div>
        </div>
      </section>

      <!-- 进度条 -->
      <div id="progress-container" class="progress-container hidden">
        <div class="progress-bar-wrapper">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="progress-text">等待中...</span>
      </div>

      <!-- 操作按钮 -->
      <section class="section-actions">
        <div class="action-bar">
          <button id="btn-start" class="btn btn-primary">开始刷积分</button>
          <button id="btn-stop" class="btn btn-danger" disabled>取消任务</button>
        </div>
      </section>
    </main>

    <!-- 日志面板 -->
    <footer class="app-footer">
      <div class="section-header"><h2>运行日志</h2></div>
      <div class="log-wrapper">
        <pre id="log-console" class="log-console">[系统] 就绪。选择执行模式后点击"开始刷积分"。</pre>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
